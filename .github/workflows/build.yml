name: build

# Manual run: build and keep the files as workflow artifacts.
# Tag v* (e.g. v25.12.6-1): also publish them as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  OWRT_VERSION: 25.12.6
  KVER: 6.12.112
  SDK: openwrt-sdk-25.12.6-bcm53xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the kernel build needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: build/dl
          key: dl-${{ env.OWRT_VERSION }}

      - name: Download SDK
        run: |
          mkdir -p build/dl build/out build/images
          mkdir -p build/out-ht build/out-kernel-fastpath
          chmod a+rwx build/out build/out-ht build/out-kernel-fastpath build/images   # containers run as uid 1000
          U=https://downloads.openwrt.org/releases/$OWRT_VERSION/targets/bcm53xx/generic
          cd build/dl
          [ -f "$SDK" ] || curl -fLO "$U/$SDK"
          curl -fsSL "$U/sha256sums" | grep " \*$SDK\$" | sed 's/ \*/  /' | sha256sum -c -

      - name: Build env image
        run: docker build -t owrt-sdk-env build

      - name: "Build kmod-b43 (802.11n: PR 25922 series + 880/881, firmware 784.2)"
        run: HT=1 FW630=1 build/run-build.sh

      - name: "Build the fast-path kernel + fastpath.ko (patches/kernel-fastpath, fastpath/, 1-2 h)"
        run: FASTPATH=1 build/build-kernel.sh

      - name: Build images
        run: |
          pip install --user fdt
          HT=1 FASTPATH=1 ZIMAGE=build/out-kernel-fastpath/zImage build/make-image.sh
          HT=1 FASTPATH=1 ZIMAGE=build/out-kernel-fastpath/zImage FIRSTBOOT=1 build/make-image.sh

      - name: Collect
        run: |
          mkdir dist
          cp build/images/*.trx dist/
          cp build/out-ht/b43-stripped.ko dist/b43-$KVER.ko
          cp build/out-ht/kmod-b43-*.apk dist/
          cp build/out-kernel-fastpath/zImage dist/zImage-$KVER-fastpath
          cp build/out-kernel-fastpath/fastpath.ko dist/fastpath-$KVER.ko
          cd dist && sha256sum * > sha256sums && cat sha256sums

      - uses: actions/upload-artifact@v4
        with:
          name: rt-ac1200g-plus-openwrt-${{ env.OWRT_VERSION }}
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Built by CI from ${GITHUB_SHA::7}."; echo; cat docs/RELEASE_NOTES.md; } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "OpenWrt $OWRT_VERSION for RT-AC1200G+ ($GITHUB_REF_NAME): 802.11n" --notes-file notes.md
